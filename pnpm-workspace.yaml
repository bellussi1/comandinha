  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@nestjs/schematics@12.0.7'
  - '@nestjs/testing@12.1.3'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
peerDependencyRules:
  allowedVersions:
    "openapi-typescript@7.13.0>typescript": 6.0.3
