  - packages/*
allowBuilds:
  '@parcel/watcher@2.6.0': true
  '@prisma/engines@7.10.0': true
  '@scarf/scarf': false
  esbuild@0.28.2: true
  prisma@7.10.0: true
  sharp@0.33.5: true
  unrs-resolver@1.12.2: true
minimumReleaseAgeExclude:
