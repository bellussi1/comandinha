name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://comandinha_test:test_only_password@127.0.0.1:5432/comandinha_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: comandinha_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: comandinha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comandinha_test -d comandinha_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @comandinha/api prisma:migrate

      - name: Install Playwright browser
        run: pnpm --filter @comandinha/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API health E2E tests
        run: pnpm --filter @comandinha/api test:e2e

      - name: PostgreSQL integration and Playwright smoke tests
        run: pnpm test:integration

      - name: Check generated API client
        run: pnpm api:client:check

      - name: Build
        run: pnpm build
